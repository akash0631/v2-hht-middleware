name: Deploy V2 HHT Middleware to Azure

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2
        with: { nuget-version: '6.x' }

      - name: NuGet Restore
        run: nuget restore V2HHTMiddleware.sln -NonInteractive

      - name: Build + Publish (full web deploy package)
        shell: powershell
        run: |
          # Use MSBuild WebPublish to get ALL required DLLs automatically
          msbuild V2HHTMiddleware.sln `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=FileSystem `
            /p:PublishUrl="${{ github.workspace }}\publish_output" `
            /p:DeleteExistingFiles=True `
            /p:VisualStudioVersion=17.0 `
            /m /v:minimal

          Write-Host "Published files:"
          Get-ChildItem "${{ github.workspace }}\publish_output" -Recurse -File | Select-Object FullName | Format-Table
          Write-Host "bin DLLs:"
          $binPath = "${{ github.workspace }}\publish_output\bin"
          if (Test-Path $binPath) {
            Get-ChildItem "$binPath\*.dll" | Select-Object Name | Format-Table
          } else {
            Write-Host "No bin subfolder - DLLs are in publish root"
            Get-ChildItem "${{ github.workspace }}\publish_output\*.dll" | Select-Object Name | Format-Table
          }

      - name: Package for Azure (plain zip)
        shell: powershell
        run: |
          $publishDir = "${{ github.workspace }}\publish_output"
          $zipPath    = "${{ github.workspace }}\deploy\app.zip"
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\deploy" | Out-Null

          Add-Type -Assembly "System.IO.Compression.FileSystem"
          [System.IO.Compression.ZipFile]::CreateFromDirectory($publishDir, $zipPath)

          $size = [math]::Round((Get-Item $zipPath).Length/1MB, 2)
          Write-Host "app.zip: ${size} MB"
          Write-Host "Contents:"
          [System.IO.Compression.ZipFile]::OpenRead($zipPath).Entries |
            Select-Object Name | Format-Table

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: v2-hht-api
          publish-profile: ${{ secrets.AZURE_HHT_PUBLISH_PROFILE }}
          package: '${{ github.workspace }}\deploy\app.zip'

      - name: Health check
        shell: powershell
        run: |
          Start-Sleep 30
          try {
            $r = Invoke-WebRequest "https://v2-hht-api.azurewebsites.net/api/hht/health" -UseBasicParsing -TimeoutSec 30
            Write-Host "✅ LIVE: $($r.Content)"
          } catch {
            Write-Host "⚠️  Pending (HCM may not be connected yet): $_"
          }
          exit 0
