name: Build Check (feature branches)
on:
  push:
    branches-ignore: [ master, main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
        with: { nuget-version: '6.x' }
      - name: Restore packages
        run: nuget restore V2HHTMiddleware.sln
      - name: Build (check only)
        run: msbuild V2HHTMiddleware.sln /p:Configuration=Release /p:Platform=AnyCPU
