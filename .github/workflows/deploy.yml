name: Deploy V2 HHT Middleware to Azure

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2
        with: { nuget-version: '6.x' }

      - name: NuGet Restore
        run: nuget restore V2HHTMiddleware.sln -NonInteractive

      - name: Build and Package
        shell: powershell
        run: |
          msbuild V2HHTMiddleware.sln `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:VisualStudioVersion=17.0 `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=Package `
            /p:PackageAsSingleFile=true `
            /p:PackageLocation="${{ github.workspace }}\publish\package.zip" `
            /p:SkipInvalidConfigurations=true `
            /m /v:minimal

      - name: Verify package
        shell: powershell
        run: |
          $zip = Get-ChildItem "${{ github.workspace }}\publish" -Filter "*.zip" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zip) { Write-Host "✅ Package ready: $($zip.Name) ($([math]::Round($zip.Length/1MB,1)) MB)" }
          else { Write-Error "❌ No package found. Build failed silently." }

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: v2-hht-api
          publish-profile: ${{ secrets.AZURE_HHT_PUBLISH_PROFILE }}
          package: '${{ github.workspace }}\publish\*.zip'

      - name: Smoke test
        shell: powershell
        run: |
          Start-Sleep 25
          try {
            $r = Invoke-WebRequest "https://v2-hht-api.azurewebsites.net/api/hht/health" -UseBasicParsing -TimeoutSec 30
            Write-Host "✅ Live: $($r.Content)"
          } catch {
            Write-Host "⚠️  Health check pending SAP connection: $_"
          }
          exit 0
