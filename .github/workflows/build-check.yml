name: Build Check (feature branches)
on:
  push:
    branches-ignore: [ master, main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
        with: { nuget-version: '6.x' }
      - name: NuGet Restore
        run: nuget restore V2HHTMiddleware.sln -NonInteractive
      - name: Build (compile check only — no deploy)
        shell: powershell
        run: |
          msbuild V2HHTMiddleware.sln `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:VisualStudioVersion=17.0 `
            /m /v:minimal
