name: Deploy V2 HHT Middleware to Azure

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2
        with: { nuget-version: '6.x' }

      - name: NuGet Restore
        run: nuget restore V2HHTMiddleware.sln -NonInteractive

      - name: Build and Package
        shell: powershell
        run: |
          # Publish to folder first (FileSystem), then zip it
          # azure/webapps-deploy doesn't accept MSDeploy .zip format
          msbuild V2HHTMiddleware.sln `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:VisualStudioVersion=17.0 `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=FileSystem `
            /p:PublishUrl="${{ github.workspace }}\published" `
            /p:DeleteExistingFiles=true `
            /m /v:minimal

      - name: Zip published output
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\deploy" | Out-Null
          Compress-Archive -Path "${{ github.workspace }}\published\*" `
            -DestinationPath "${{ github.workspace }}\deploy\app.zip" -Force
          $size = [math]::Round((Get-Item "${{ github.workspace }}\deploy\app.zip").Length/1MB, 1)
          Write-Host "✅ app.zip ready: ${size} MB"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: v2-hht-api
          publish-profile: ${{ secrets.AZURE_HHT_PUBLISH_PROFILE }}
          package: '${{ github.workspace }}\deploy\app.zip'

      - name: Smoke test
        shell: powershell
        run: |
          Start-Sleep 25
          try {
            $r = Invoke-WebRequest "https://v2-hht-api.azurewebsites.net/api/hht/health" -UseBasicParsing -TimeoutSec 30
            Write-Host "✅ Live: $($r.Content)"
          } catch {
            Write-Host "⚠️  Health check pending SAP connection: $_"
          }
          exit 0
