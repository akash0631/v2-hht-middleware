name: Deploy V2 HHT Middleware to Azure

# ONE branch deploys to v2-hht-api. Previously `azure-optimised` carried its own
# copy of this file listing itself in the trigger, so two branches deployed to the
# same app. azure-optimised is 58 commits BEHIND master and still builds 5.0.
# On 2026-10-03 the worm pushed both at once; azure-optimised finished 30 s later,
# overwrote master's correct build with a V2HHTMiddleware.dll 25,600 bytes smaller,
# and took HHT PROD down for 55 minutes. Do not re-add a second branch here.
on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Two runs can never interleave and race to write the package.
concurrency:
  group: deploy-v2-hht-api
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: windows-latest
    environment: hht-prod          # required reviewer configured in repo settings

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2
        with: { nuget-version: '6.x' }

      - name: NuGet Restore
        run: nuget restore V2HHTMiddleware.sln -NonInteractive

      - name: Build
        shell: powershell
        run: |
          msbuild V2HHTMiddleware.sln `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:VisualStudioVersion=17.0 `
            /m /v:minimal

      - name: Package for Azure
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $binDir = Get-ChildItem -Path "." -Recurse -Filter "V2HHTMiddleware.dll" |
            Where-Object { $_.DirectoryName -notmatch "obj" } |
            Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $binDir) { throw "Build output not found" }
          Write-Host "Build output: $binDir"

          $deployDir = "${{ github.workspace }}\deploy_content"
          New-Item -ItemType Directory -Force -Path "$deployDir\bin" | Out-Null

          Copy-Item "$binDir\*.dll" "$deployDir\bin\" -Force
          Copy-Item "$binDir\*.pdb" "$deployDir\bin\" -Force -ErrorAction SilentlyContinue

          # Resolve NuGet DLLs by glob, not by hardcoded version. A version bump used
          # to silently drop a DLL here and only print a warning.
          $needed = @(
            "System.Net.Http.Formatting.dll",
            "Microsoft.Web.Infrastructure.dll",
            "WebActivatorEx.dll",
            "System.Web.Http.dll",
            "System.Web.Http.WebHost.dll",
            "Newtonsoft.Json.dll"
          )
          foreach ($name in $needed) {
            if (Test-Path "$deployDir\bin\$name") { continue }
            $hit = Get-ChildItem -Path "packages" -Recurse -Filter $name -ErrorAction SilentlyContinue |
                   Select-Object -First 1
            # A missing runtime DLL is fatal. It used to be a Write-Host warning.
            if (-not $hit) { throw "Required runtime assembly not found: $name" }
            Copy-Item $hit.FullName "$deployDir\bin\" -Force
            Write-Host "Copied $name from $($hit.FullName)"
          }

          $nco = Get-ChildItem -Path "packages" -Recurse -Filter "sapnco*.dll" -ErrorAction SilentlyContinue
          if (-not $nco) { throw "SAP NCo assemblies not found" }
          Copy-Item (Join-Path $nco[0].DirectoryName "*.dll") "$deployDir\bin\" -Force

          Copy-Item "Web.config" "$deployDir\" -Force
          Copy-Item "Global.asax" "$deployDir\" -Force -ErrorAction SilentlyContinue

          Get-ChildItem "$deployDir\bin" |
            Select-Object Name, @{N="KB";E={[int]($_.Length/1KB)}} | Format-Table

          $zipPath = "${{ github.workspace }}\deploy\app.zip"
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\deploy" | Out-Null
          Compress-Archive -Path "$deployDir\*" -DestinationPath $zipPath -Force
          Write-Host "app.zip: $([math]::Round((Get-Item $zipPath).Length/1MB,2)) MB"

      - name: Gate - compare artefact against what is live
        shell: powershell
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_HHT_PUBLISH_PROFILE }}
        run: |
          $ErrorActionPreference = "Stop"
          # The 3-Oct outage shipped a V2HHTMiddleware.dll 25,600 bytes (19.7%) smaller
          # than the one it replaced, because a stale branch built a different codebase.
          # Nothing compared the two. This does.
          $localDll = (Get-ChildItem "${{ github.workspace }}\deploy_content\bin\V2HHTMiddleware.dll").Length
          Write-Host "new V2HHTMiddleware.dll = $localDll bytes"

          # Kudu credentials come out of the publish profile we already hold.
          # No second secret to create, rotate or leak.
          [xml]$pp = $env:PUBLISH_PROFILE
          $msdeploy = $pp.publishData.publishProfile | Where-Object { $_.publishMethod -eq 'MSDeploy' }
          if (-not $msdeploy) { throw "MSDeploy profile not found in AZURE_HHT_PUBLISH_PROFILE" }
          $pair = "$($msdeploy.userName):$($msdeploy.userPWD)"
          $auth = "Basic " + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
          $hdr  = @{ Authorization = $auth }
          $base = "https://v2-hht-api.scm.azurewebsites.net/api/vfs/data/SitePackages"

          $current = (Invoke-WebRequest "$base/packagename.txt" -Headers $hdr -UseBasicParsing).Content.Trim()
          Write-Host "currently live package: $current"
          "$current" | Out-File -FilePath "${{ github.workspace }}\previous_package.txt" -Encoding ascii -NoNewline

          Invoke-WebRequest "$base/$current" -Headers $hdr -OutFile "$env:TEMP\live.zip" -UseBasicParsing
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead("$env:TEMP\live.zip")
          # Match on Name, not FullName. Compress-Archive writes entries with BACKSLASH
          # separators ("bin\V2HHTMiddleware.dll"), so a "bin/..." comparison never matches
          # and the gate silently measures nothing - the same shape of defect as the health
          # check that printed a green tick next to java=err on 2026-10-03.
          $entry = $z.Entries | Where-Object { $_.Name -eq "V2HHTMiddleware.dll" } | Select-Object -First 1
          $liveDll = if ($entry) { $entry.Length } else { 0 }
          $z.Dispose()
          Write-Host "live V2HHTMiddleware.dll = $liveDll bytes"

          # A gate that cannot measure must fail, never pass quietly.
          if ($liveDll -le 0) { throw "Could not read V2HHTMiddleware.dll from the live package $current - refusing to deploy blind." }

          $drift = [math]::Abs($localDll - $liveDll) / $liveDll
          Write-Host ("drift = {0:P2}" -f $drift)
          if ($drift -gt 0.05) {
            throw "Main assembly differs from live by $([math]::Round($drift*100,1))% (limit 5%). Deploy blocked. Re-run via workflow_dispatch only if this change is intended."
          }

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: v2-hht-api
          publish-profile: ${{ secrets.AZURE_HHT_PUBLISH_PROFILE }}
          package: '${{ github.workspace }}\deploy\app.zip'

      - name: Health gate - must reach SAP, or roll back
        shell: powershell
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_HHT_PUBLISH_PROFILE }}
        run: |
          # The old version of this step wrapped everything in try/catch and ended in
          # `exit 0`. That is why the 3-Oct deploy reported success while every device
          # call failed. The endpoint was always good; the result was thrown away.
          $ok = $false
          $body = ""
          foreach ($i in 1..10) {
            Start-Sleep 12
            try {
              $body = (Invoke-WebRequest "https://v2-hht-api.azurewebsites.net/api/hht/health" `
                        -UseBasicParsing -TimeoutSec 30).Content
              Write-Host "attempt ${i}: $body"
              if ($body -match '^OK\|' -and $body -match 'java=ok:200') { $ok = $true; break }
            } catch {
              Write-Host "attempt ${i}: $_"
            }
          }

          # Independent proof: a real RFC round trip to SAP PROD through the device path.
          if ($ok) {
            try {
              $r = Invoke-WebRequest -Method POST -UseBasicParsing -TimeoutSec 40 `
                "https://v2-hht-api.azurewebsites.net/api/hht?env=prod&bapiname=STFC_CONNECTION" `
                -ContentType "application/json" -Body '{"REQUTEXT":"PING"}'
              Write-Host "STFC_CONNECTION: $($r.Content)"
              if ($r.Content -notmatch 'Sysid:\s*S4P') { $ok = $false }
            } catch { $ok = $false }
          }

          if ($ok) { Write-Host "Health gate passed."; exit 0 }

          Write-Host "::error::Health gate FAILED. Rolling back."
          $prev = (Get-Content "${{ github.workspace }}\previous_package.txt" -Raw).Trim()
          if (-not $prev) { throw "Health gate failed and no previous package recorded - manual rollback required." }

          [xml]$pp = $env:PUBLISH_PROFILE
          $msdeploy = $pp.publishData.publishProfile | Where-Object { $_.publishMethod -eq 'MSDeploy' }
          $pair = "$($msdeploy.userName):$($msdeploy.userPWD)"
          $auth = "Basic " + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
          Invoke-WebRequest -Method PUT -UseBasicParsing `
            "https://v2-hht-api.scm.azurewebsites.net/api/vfs/data/SitePackages/packagename.txt" `
            -Headers @{ Authorization = $auth; "If-Match" = "*" } `
            -ContentType "application/octet-stream" -Body $prev
          Write-Host "Rolled back to $prev. Restart the app, then investigate."
          exit 1
